<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body{
            background-color: antiquewhite;
            display: flex;
            flex-direction: column;
            justify-content: start;
            align-items: center;
            min-height: 100vh;
        }

        section{
            margin: 20px 0px;
            background-color: antiquewhite;
            height: 500px; 
            width: 90%;
            border-radius: 25px;
            border: 2px solid brown;
            transition: all 0.3s;

        }

        section:hover{
            
            border: 4px solid brown;
        }

        .inner-section{
            width: 90%;
            margin: 25px auto;
            background-color: antiquewhite;
            height: 250px;
            width: 90%;
            border-radius: 25px;
            border: 2px solid brown;
            transition: all 0.3s;
            box-shadow: 6px 6px 0px 5px brown;
        }





    </style>
</head>
<body>

    <section>


        
        <div class="inner-section">
            


        </div>






    </section>

    
    
</body>
</html>
